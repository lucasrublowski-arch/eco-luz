
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>

        <nav>

            <a href="#contato">Contato</a>
        </nav>

    <main id="inicio">

            <p class="subtitulo">BEM-VINDO AO MEU SITE</p>

        <section id="sobre" class="sobre">
            <h2>Sobre o projeto</h2>
            <p>Este é meu primeiro site feito no VS Code!</p>
        </section>

        <section id="contato" class="contato">
            <h2>Contato</h2>
            <p>Adicione aqui suas redes sociais.</p>
        </section>
    </main>

    <footer>
        <p>© 2026 MeuSite. Feito com criatividade.</p>
    </footer>

    <script src="script.js"></script>

</html>
